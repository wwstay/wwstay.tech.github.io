<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WWStay Technologies</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .logo span {
      color: #4f8ef7;
    }

    .tagline {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #4f8ef7;
      border-radius: 2px;
      margin: 0 auto 2.5rem;
    }

    .description {
      font-size: 1rem;
      line-height: 1.7;
      color: #aaa;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">WW<span>Stay</span></div>
    <p class="tagline">Technologies</p>
    <div class="divider"></div>
    <p class="description">
      WWStay Technologies is a holding company building products and platforms
      at the intersection of travel, hospitality, and technology.
    </p>
    <footer>&copy; <script>document.write(new Date().getFullYear())</script> WWStay Technologies. All rights reserved.</footer>
  </div>
</body>
</html>
